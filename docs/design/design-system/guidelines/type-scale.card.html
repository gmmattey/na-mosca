<!-- @dsCard group="Type" viewport="700x260" name="Escala Tipografica" subtitle="Ladder completo dos tokens de texto" -->
<link rel="stylesheet" href="../styles.css">
<div style="height:260px;background:var(--surface-light);padding:16px 24px;display:flex;flex-direction:column;gap:6px;color:var(--text-on-light)">
<div style="display:flex;align-items:baseline;gap:12px"><span style="font:var(--text-guess);font-size:44px">38</span><span style="font:var(--text-body-sm);color:var(--text-on-light-muted)">--text-guess</span></div>
<div style="display:flex;align-items:baseline;gap:12px"><span style="font:var(--text-h1)">CRAVOU!</span><span style="font:var(--text-body-sm);color:var(--text-on-light-muted)">--text-h1</span></div>
<div style="display:flex;align-items:baseline;gap:12px"><span style="font:var(--text-h2)">Resultado</span><span style="font:var(--text-body-sm);color:var(--text-on-light-muted)">--text-h2</span></div>
<div style="display:flex;align-items:baseline;gap:12px"><span style="font:var(--text-question)">Quantos ossos tem o corpo?</span><span style="font:var(--text-body-sm);color:var(--text-on-light-muted)">--text-question</span></div>
<div style="display:flex;align-items:baseline;gap:12px"><span style="font:var(--text-body)">Texto de apoio e microcopy.</span><span style="font:var(--text-body-sm);color:var(--text-on-light-muted)">--text-body</span></div>
<div style="display:flex;align-items:baseline;gap:12px"><span style="font:var(--text-label);letter-spacing:var(--tracking-label)">CATEGORIA</span><span style="font:var(--text-body-sm);color:var(--text-on-light-muted)">--text-label</span></div>
</div>
