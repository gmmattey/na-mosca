<!-- @dsCard group="Spacing" viewport="700x220" name="Escala de Espacamento" subtitle="Base 4px, de --space-1 a --space-9" -->
<link rel="stylesheet" href="../styles.css">
<div style="height:220px;background:var(--surface-light);display:flex;flex-direction:column;justify-content:center;gap:8px;padding:0 24px;font-family:var(--font-body)">
<div style="display:flex;align-items:center;gap:10px"><div style="width:var(--space-1);height:14px;background:var(--text-dark)"></div><span style="font:var(--text-body-sm)">--space-1 / 4px</span></div>
<div style="display:flex;align-items:center;gap:10px"><div style="width:var(--space-2);height:14px;background:var(--text-dark)"></div><span style="font:var(--text-body-sm)">--space-2 / 8px</span></div>
<div style="display:flex;align-items:center;gap:10px"><div style="width:var(--space-3);height:14px;background:var(--text-dark)"></div><span style="font:var(--text-body-sm)">--space-3 / 12px</span></div>
<div style="display:flex;align-items:center;gap:10px"><div style="width:var(--space-4);height:14px;background:var(--text-dark)"></div><span style="font:var(--text-body-sm)">--space-4 / 16px</span></div>
<div style="display:flex;align-items:center;gap:10px"><div style="width:var(--space-5);height:14px;background:var(--text-dark)"></div><span style="font:var(--text-body-sm)">--space-5 / 24px</span></div>
<div style="display:flex;align-items:center;gap:10px"><div style="width:var(--space-6);height:14px;background:var(--text-dark)"></div><span style="font:var(--text-body-sm)">--space-6 / 32px</span></div>
<div style="display:flex;align-items:center;gap:10px"><div style="width:var(--space-7);height:14px;background:var(--text-dark)"></div><span style="font:var(--text-body-sm)">--space-7 / 48px</span></div>
</div>
