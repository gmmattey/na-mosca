<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Chuta Essa! — Criar sala</title>
<link rel="stylesheet" href="../../../design-system/tokens/colors.css"><link rel="stylesheet" href="../../../design-system/tokens/typography.css"><link rel="stylesheet" href="../../../design-system/tokens/spacing.css"><link rel="stylesheet" href="../../../design-system/tokens/effects.css"><link rel="stylesheet" href="../../../design-system/styles.css"><script src="https://code.iconify.design/iconify-icon/2.1.0/iconify-icon.min.js"></script><style>html,body{margin:0;min-height:100%;background:#080909;display:grid;place-items:start center} body>div{width:min(390px,100vw)!important;min-height:100vh;box-sizing:border-box} button{font-family:inherit}</style></head><body><div style="width:390px;height:844px;background:var(--bg-dark);display:flex;flex-direction:column;justify-content:space-between;padding:48px 28px 40px;box-sizing:border-box;">
<div style="display:flex;align-items:center;gap:16px;"><iconify-icon height="22" icon="lucide:arrow-left" style="color:var(--text-on-dark-muted);display:inline-block;vertical-align:middle;" width="22"></iconify-icon><span style="font:var(--text-label);letter-spacing:var(--tracking-label);color:var(--text-on-dark-muted);">CRIAR SALA</span></div>
<div style="display:flex;flex-direction:column;gap:28px;">
<div><div style="font:var(--text-label);letter-spacing:var(--tracking-label);color:var(--text-on-dark-muted);margin-bottom:12px;">NÚMERO DE PERGUNTAS</div><div style="display:flex;gap:10px;"><span style="font:var(--text-button);color:var(--text-on-dark-muted);border:1px solid var(--border-on-dark);border-radius:var(--radius-pill);padding:8px 18px;">5</span><span style="font:var(--text-button);color:var(--text-dark);background:var(--accent-primary);border-radius:var(--radius-pill);padding:8px 18px;">10</span></div></div>
<div><div style="font:var(--text-label);letter-spacing:var(--tracking-label);color:var(--text-on-dark-muted);margin-bottom:12px;">CATEGORIAS</div><div style="display:flex;gap:8px;flex-wrap:wrap;"><span style="font:var(--text-button);color:var(--text-dark);background:var(--accent-primary);border-radius:var(--radius-pill);padding:8px 16px;">Todas</span><span style="font:var(--text-button);color:var(--text-on-dark-muted);border:1px solid var(--border-on-dark);border-radius:var(--radius-pill);padding:8px 16px;">Brasil</span><span style="font:var(--text-button);color:var(--text-on-dark-muted);border:1px solid var(--border-on-dark);border-radius:var(--radius-pill);padding:8px 16px;">Ciência</span></div></div>
<div><div style="font:var(--text-label);letter-spacing:var(--tracking-label);color:var(--text-on-dark-muted);margin-bottom:12px;">TEMPO POR PERGUNTA</div><div style="display:flex;gap:10px;"><span style="font:var(--text-button);color:var(--text-on-dark-muted);border:1px solid var(--border-on-dark);border-radius:var(--radius-pill);padding:8px 18px;">10s</span><span style="font:var(--text-button);color:var(--text-dark);background:var(--accent-primary);border-radius:var(--radius-pill);padding:8px 18px;">20s</span><span style="font:var(--text-button);color:var(--text-on-dark-muted);border:1px solid var(--border-on-dark);border-radius:var(--radius-pill);padding:8px 18px;">30s</span></div></div>
</div><button style="display:inline-flex;align-items:center;justify-content:center;border-radius:var(--radius-pill);padding:14px 28px;font:var(--text-button);min-height:52px;cursor:default;background:var(--cta-bg);color:var(--cta-text);border:none;" type="button">Criar sala</button>
</div></body></html>
